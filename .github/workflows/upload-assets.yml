name: upload-release-assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.11"
        required: true
      full_sha256:
        description: "SHA-256 of MGU-SSH-Native-<version>.zip"
        required: true
      update_sha256:
        description: "SHA-256 of MGU-SSH-Native-Update-<version>.zip"
        required: true
      setup_sha256:
        description: "SHA-256 of MGU-SSH-Setup-<version>.exe"
        required: true
  push:
    tags:
      - "assets-*"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the asset list
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
            full="${{ inputs.full_sha256 }}"
            update="${{ inputs.update_sha256 }}"
            setup="${{ inputs.setup_sha256 }}"
          else
            version=$(jq -r .version release-assets.json)
            full=$(jq -r .full_sha256 release-assets.json)
            update=$(jq -r .update_sha256 release-assets.json)
            setup=$(jq -r .setup_sha256 release-assets.json)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "full_sha256=$full" >> "$GITHUB_OUTPUT"
          echo "update_sha256=$update" >> "$GITHUB_OUTPUT"
          echo "setup_sha256=$setup" >> "$GITHUB_OUTPUT"

      - name: Fetch packages from CloudBase and verify
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          FULL_SHA256: ${{ steps.meta.outputs.full_sha256 }}
          UPDATE_SHA256: ${{ steps.meta.outputs.update_sha256 }}
          SETUP_SHA256: ${{ steps.meta.outputs.setup_sha256 }}
        run: |
          set -euo pipefail
          base="https://defiant-kangaroo-d2encfh03956269-1319395559.tcloudbaseapp.com"
          full="MGU-SSH-Native-${VERSION}.zip"
          update="MGU-SSH-Native-Update-${VERSION}.zip"
          setup="MGU-SSH-Setup-${VERSION}.exe"
          curl -fL --retry 5 --retry-delay 5 -o "$full" "$base/$full"
          curl -fL --retry 5 --retry-delay 5 -o "$update" "$base/$update"
          curl -fL --retry 5 --retry-delay 5 -o "$setup" "$base/$setup"
          echo "${FULL_SHA256}  ${full}" | sha256sum -c -
          echo "${UPDATE_SHA256}  ${update}" | sha256sum -c -
          echo "${SETUP_SHA256}  ${setup}" | sha256sum -c -

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "MGU-SSH-Native-${VERSION}.zip" > "MGU-SSH-Native-${VERSION}.zip.sha256"
          sha256sum "MGU-SSH-Native-Update-${VERSION}.zip" > "MGU-SSH-Native-Update-${VERSION}.zip.sha256"
          sha256sum "MGU-SSH-Setup-${VERSION}.exe" > "MGU-SSH-Setup-${VERSION}.exe.sha256"
          gh release upload "v${VERSION}" --clobber \
            "MGU-SSH-Native-${VERSION}.zip" \
            "MGU-SSH-Native-Update-${VERSION}.zip" \
            "MGU-SSH-Setup-${VERSION}.exe" \
            latest.json latest.json.sig \
            "MGU-SSH-Native-${VERSION}.zip.sha256" \
            "MGU-SSH-Native-Update-${VERSION}.zip.sha256" \
            "MGU-SSH-Setup-${VERSION}.exe.sha256" \
            -R "$GITHUB_REPOSITORY"
          gh release view "v${VERSION}" -R "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "\(.name) \(.size)"'
